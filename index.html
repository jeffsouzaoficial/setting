<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Setting</title>
</head>
<body>
  <h1>Setting</h1>

  <label for="filtro-dia">Mostrar:</label>
  <select id="filtro-dia">
    <option value="todos">Semana inteira</option>
    <option value="segunda">Segunda</option>
    <option value="terça">Terça</option>
    <option value="quarta">Quarta</option>
    <option value="quinta">Quinta</option>
    <option value="sexta">Sexta</option>
  </select>

  <h2>Novo paciente</h2>
  <input id="campo-nome" placeholder="Nome">
  <input id="campo-whatsapp" placeholder="WhatsApp (só números, com 55)">
  <select id="campo-dia">
    <option value="segunda">Segunda</option>
    <option value="terça">Terça</option>
    <option value="quarta">Quarta</option>
    <option value="quinta">Quinta</option>
    <option value="sexta">Sexta</option>
  </select>
  <input id="campo-horario" type="time">
  <input id="campo-valor" type="number" placeholder="Valor da sessão">
  <button id="botao-cadastrar">Cadastrar</button>

  <ul id="agenda"></ul>

  <h2>Feriados de 2026</h2>
  <ul id="lista-feriados"></ul>

  <p id="faturamento"></p>
  <p id="minutos"></p>
  <p id="total-pacientes"></p>

  <script src="script.js"></script>
</body>
</html>
